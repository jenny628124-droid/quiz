<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>電乙學科線上測驗</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: auto; background: #f9f9f9; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .btn-group button { padding: 8px 15px; margin: 5px; border: 1px solid #007bff; background: white; color: #007bff; border-radius: 4px; cursor: pointer; }
    .btn-group button.active { background: #007bff; color: white; }
    .btn-start { background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
    input[type="text"], input[type="number"] { padding: 6px; margin: 5px; }
    .q-box { margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
  </style>
</head>
<body>

<div class="card" id="setup-panel">
  <p>學號：<input type="text" id="studentId"> 姓名：<input type="text" id="studentName"></p>
  
  <p><strong>工作項目：</strong></p>
  <div class="btn-group">
    <button type="button" onclick="selectCategory('工作項目01', this)">01</button>
    <button type="button" onclick="selectCategory('工作項目02', this)">02</button>
    <button type="button" onclick="selectCategory('工作項目03', this)">03</button>
    <button type="button" onclick="selectCategory('工作項目04', this)">04</button>
  </div>

  <p><strong>共同科目：</strong></p>
  <div class="btn-group">
    <button type="button" onclick="selectCategory('共同-01', this)">共同-01</button>
    <button type="button" onclick="selectCategory('共同-02', this)">共同-02</button>
    <button type="button" onclick="selectCategory('共同-03', this)">共同-03</button>
    <button type="button" onclick="selectCategory('共同-04', this)">共同-04</button>
  </div>

  <p>範圍限制 (選填)：從第 <input type="number" id="startQ" placeholder="全部"> 題 到第 <input type="number" id="endQ" placeholder="全部"> 題</p>
  <p>抽出題數：<input type="number" id="countQ" value="20"> 題 <button type="button" class="btn-start" onclick="startQuiz()">開始抽題作答</button></p>
</div>

<div class="card" id="quiz-panel" style="display:none;">
  <div id="questions-container"></div>
  <button type="button" class="btn-start" onclick="submitQuiz()">提交試卷</button>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbw8tub3qETZdXxoLSpLk0jogZEtJIO9rxq7_P3tWYpnVXiTJ5jfLPfmSHLff0qHWpcoNQ/exec";
  let selectedCategory = "";
  let currentQuestions = [];

  function selectCategory(cat, btnElement) {
    selectedCategory = cat;
    document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
    if (btnElement) {
      btnElement.classList.add('active');
    }
  }

  function startQuiz() {
    const id = document.getElementById('studentId').value.trim();
    const name = document.getElementById('studentName').value.trim();
    const count = document.getElementById('countQ').value;
    const start = document.getElementById('startQ').value;
    const end = document.getElementById('endQ').value;

    if (!id || !name) return alert("請填寫學號與姓名");
    if (!selectedCategory) return alert("請選擇工作項目或共同科目");

    // 發送 GET 請求並加入 redirect: 'follow' 處理轉址
    fetch(`${API_URL}?category=${encodeURIComponent(selectedCategory)}&count=${count}&start=${start}&end=${end}`, {
      method: 'GET',
      redirect: 'follow'
    })
      .then(res => res.json())
      .then(data => {
        if (!data || data.length === 0) {
          alert("抓取不到題目，請確認試算表是否有對應分類資料！");
          return;
        }
        currentQuestions = data;
        renderQuiz();
      })
      .catch(err => {
        console.error("API 請求失敗：", err);
        alert("資料抓取失敗，請確認網路連線或 GAS 部署權限。");
      });
  }

  function renderQuiz() {
    document.getElementById('setup-panel').style.display = 'none';
    document.getElementById('quiz-panel').style.display = 'block';
    const container = document.getElementById('questions-container');
    container.innerHTML = "";

    currentQuestions.forEach((q, index) => {
      container.innerHTML += `
        <div class="q-box">
          <p><strong>${index + 1}. ${q[2]}</strong></p>
          <label><input type="radio" name="q${index}" value="1"> A. ${q[3]}</label><br>
          <label><input type="radio" name="q${index}" value="2"> B. ${q[4]}</label><br>
          <label><input type="radio" name="q${index}" value="3"> C. ${q[5]}</label><br>
          <label><input type="radio" name="q${index}" value="4"> D. ${q[6]}</label>
        </div>
      `;
    });
  }

  function submitQuiz() {
    let correctCount = 0;
    const total = currentQuestions.length;
    const perScore = 100 / total;

    currentQuestions.forEach((q, index) => {
      const selected = document.querySelector(`input[name="q${index}"]:checked`);
      if (selected && parseInt(selected.value) === parseInt(q[7])) {
        correctCount++;
      }
    });

    const finalScore = Math.round(correctCount * perScore);
    alert(`測驗結束！您的總分為：${finalScore} 分`);

    fetch(API_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        studentId: document.getElementById('studentId').value,
        studentName: document.getElementById('studentName').value,
        category: selectedCategory,
        score: finalScore
      })
    })
    .then(() => location.reload())
    .catch(err => console.error("成績提交失敗：", err));
  }
</script>

</body>
</html>
