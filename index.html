  let selectedCategory = '';
  let activeQuestions = [];

  function selectCategory(cat, btn) {
    selectedCategory = cat;
    const buttons = btn.parentElement.querySelectorAll('button');
    buttons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  function startQuiz() {
    if (!selectedCategory) {
      alert("請先選擇科目分類！");
      return;
    }

    let filtered = QUESTION_BANK.filter(q => q[0] === selectedCategory);
    
    if (filtered.length === 0) {
      alert("該分類目前無題目！");
      return;
    }

    const startQ = parseInt(document.getElementById('startQ').value);
    const endQ = parseInt(document.getElementById('endQ').value);

    if (!isNaN(startQ)) {
      filtered = filtered.filter(q => q[1] >= startQ);
    }
    if (!isNaN(endQ)) {
      filtered = filtered.filter(q => q[1] <= endQ);
    }

    if (filtered.length === 0) {
      alert("指定題號範圍內無符合條件的題目！");
      return;
    }

    let count = parseInt(document.getElementById('countQ').value) || 20;
    
    // 隨機抽題 (Fisher-Yates 洗牌演算法)
    let shuffled = [...filtered];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    
    activeQuestions = shuffled.slice(0, count);

    renderQuestions();
    document.getElementById('setup-panel').style.display = 'none';
    document.getElementById('quiz-panel').style.display = 'block';
  }

  function renderQuestions() {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    activeQuestions.forEach((q, idx) => {
      const qNum = idx + 1;
      const ansStr = String(q[7]);
      const isMulti = ansStr.length > 1;
      const inputType = isMulti ? 'checkbox' : 'radio';

      let html = `<div class="q-box" id="q-box-${idx}">
        <div class="q-title">${qNum}. [${q[0]}-${q[1]}] ${q[2]} ${isMulti ? '<span style="color:#d9534f;">(複選)</span>' : ''}</div>
        <div class="q-options">`;

      for (let optIdx = 1; optIdx <= 4; optIdx++) {
        const optText = q[2 + optIdx];
        if (optText) {
          html += `<label>
            <input type="${inputType}" name="q-${idx}" value="${optIdx}">
            (${optIdx}) ${optText}
          </label>`;
        }
      }

      html += `</div>
        <div class="ans-detail" id="ans-detail-${idx}"></div>
      </div>`;

      container.insertAdjacentHTML('beforeend', html);
    });
  }

  function submitQuiz() {
    let score = 0;
    const total = activeQuestions.length;
    const perScore = 100 / total;

    activeQuestions.forEach((q, idx) => {
      const inputs = Array.from(document.querySelectorAll(`input[name="q-${idx}"]:checked`));
      const userAns = inputs.map(i => i.value).sort().join('');
      const correctAns = String(q[7]).split('').sort().join('');

      const detailDiv = document.getElementById(`ans-detail-${idx}`);
      
      if (userAns === correctAns) {
        score += perScore;
        detailDiv.innerHTML = `<div class="correct-ans">✓ 正確</div>`;
      } else {
        detailDiv.innerHTML = `<div class="wrong-ans">✗ 錯誤 (正確答案：${correctAns})</div>`;
      }
    });

    const finalScore = Math.round(score * 10) / 10;
    document.getElementById('quiz-result').innerHTML = `<div class="score-box">測驗結果：${finalScore} 分</div>`;
    document.getElementById('btn-submit').style.display = 'none';
    document.getElementById('btn-restart').style.display = 'inline-block';
  }
</script>
