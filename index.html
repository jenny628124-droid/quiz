  let selectedCategory = "";
  let currentQuestions = [];

  function selectCategory(cat, btnElement) {
    selectedCategory = cat;
    document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
    if (btnElement) {
      btnElement.classList.add('active');
    }
  }

  function startQuiz() {
    const id = document.getElementById('studentId').value.trim();
    const name = document.getElementById('studentName').value.trim();
    const countInput = document.getElementById('countQ').value;
    const startInput = document.getElementById('startQ').value;
    const endInput = document.getElementById('endQ').value;

    if (!id || !name) return alert("請填寫學號與姓名");
    if (!selectedCategory) return alert("請選擇工作項目或共同科目");

    // 1. 根據選擇的分類過濾題目
    let pool = QUESTION_BANK.filter(q => q[0] === selectedCategory);

    if (pool.length === 0) {
      return alert(`「${selectedCategory}」目前沒有題庫資料，請先在程式碼中新增！`);
    }

    // 2. 處理範圍限制 (1-based index)
    const startNum = parseInt(startInput) || 1;
    const endNum = parseInt(endInput) || pool.length;
    pool = pool.slice(startNum - 1, endNum);

    if (pool.length === 0) {
      return alert("設定的題目範圍內沒有可用的題目！");
    }

    // 3. 隨機抽題 (洗牌演算法)
    pool.sort(() => Math.random() - 0.5);
    const drawCount = Math.min(parseInt(countInput) || 20, pool.length);
    currentQuestions = pool.slice(0, drawCount);

    renderQuiz();
  }

  function renderQuiz() {
    document.getElementById('setup-panel').style.display = 'none';
    document.getElementById('quiz-panel').style.display = 'block';
    const container = document.getElementById('questions-container');
    container.innerHTML = "";

    currentQuestions.forEach((q, index) => {
      container.innerHTML += `
        <div class="q-box">
          <p><strong>${index + 1}. ${q[2]}</strong></p>
          <label><input type="radio" name="q${index}" value="1"> A. ${q[3]}</label><br>
          <label><input type="radio" name="q${index}" value="2"> B. ${q[4]}</label><br>
          <label><input type="radio" name="q${index}" value="3"> C. ${q[5]}</label><br>
          <label><input type="radio" name="q${index}" value="4"> D. ${q[6]}</label>
        </div>
      `;
    });
  }

  function submitQuiz() {
    let correctCount = 0;
    const total = currentQuestions.length;
    const perScore = 100 / total;

    currentQuestions.forEach((q, index) => {
      const selected = document.querySelector(`input[name="q${index}"]:checked`);
      if (selected && parseInt(selected.value) === parseInt(q[7])) {
        correctCount++;
      }
    });

    const finalScore = Math.round(correctCount * perScore);
    alert(`測驗結束！您的總分為：${finalScore} 分`);
    location.reload(); // 重整頁面回到初始狀態
  }
</script>
